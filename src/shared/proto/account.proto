syntax = "proto3";

package account;

service AccountService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (LoginResponse);
  rpc OtpSend(Data) returns (OtpResponse);
  rpc VerifyOtp(OtpVerify) returns (OtpVResponse);
  
}

message UserId {
  string userId = 1;
}

message Data {
  string email = 1;
  string name = 2;
}

message OtpVerify {
  string otp = 1;
  string token = 2;
}

message OtpVResponse {
  bool success= 1;
  string message = 2;
}

message OtpResponse {
  bool success = 1;
  string message = 2;
  string otp = 3;
  string token = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string role = 3;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
  string authToken = 4;
  string refreshToken = 5;
}

message User {
  string name = 1;
  string email = 2;
  string userId = 3;
}

message RegisterRequest {
  string email = 1;
  string name = 2;
  string password = 3;
  string phone = 4;
  string role = 5;
}